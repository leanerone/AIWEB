name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  e2e-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          npm ci --no-audit --no-fund
      # dist 必须存在：后端只在 dist 存在时注册 SPA 兜底路由，否则托管断言只能跳过
      - name: Build frontend
        run: npm run build
      - name: Start mock LLM + backend
        working-directory: backend
        run: |
          python ../scripts/mock_llm.py &
          AI_API_BASE=http://127.0.0.1:9377/v1 \
          AI_API_KEY=sk-mock-ci \
          AI_MODEL=mock-mini \
          SEED_DEMO=1 python run.py &
          sleep 6
      - name: API E2E
        run: python scripts/e2e_check.py --base http://127.0.0.1:8000
